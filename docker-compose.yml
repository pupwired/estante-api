services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: estante
      POSTGRES_PASSWORD: estante
      POSTGRES_DB: estante
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro   # runs *.sql on first start
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
